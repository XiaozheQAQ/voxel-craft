<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Craft — Community Portal</title>
<style>
  :root{
    --bg:#14161c; --panel:#1c1f28; --panel2:#232733; --border:#333846;
    --text:#e8eaf0; --muted:#9099ac; --accent:#5b8def; --accent2:#3f6fce;
    --danger:#e3584f; --danger2:#c8433b; --ok:#4caf7d; --warn:#d8a33e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;font-weight:600;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  nav{display:flex;gap:6px;flex-wrap:wrap;}
  nav button{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;}
  nav button.active{background:var(--accent);border-color:var(--accent);}
  nav button:hover{border-color:var(--accent);}
  .top-actions{display:flex;align-items:center;gap:10px;}
  select.lang{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;}
  main{max-width:920px;margin:0 auto;padding:24px 20px 80px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:18px;}
  .panel h2{margin-top:0;font-size:15px;}
  label.field-label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;}
  input[type=text],input[type=email],input[type=password],textarea{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:9px 10px;font-size:13px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  button.btn{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;}
  button.btn:hover{background:var(--accent2);}
  button.btn.secondary{background:transparent;color:var(--text);border-color:var(--border);}
  button.btn.danger{background:var(--danger);border-color:var(--danger);}
  button.btn.danger:hover{background:var(--danger2);}
  button.btn:disabled{opacity:.5;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .msg{padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0;}
  .msg.error{background:rgba(227,88,79,.15);border:1px solid var(--danger);color:#ffb3ae;}
  .msg.ok{background:rgba(76,175,125,.15);border:1px solid var(--ok);color:#9fe3bf;}
  .msg.warn{background:rgba(216,163,62,.15);border:1px solid var(--warn);color:#f0cb84;}
  .msg.info{background:rgba(91,141,239,.15);border:1px solid var(--accent);color:#b9d0fb;}
  .hidden{display:none !important;}
  .trust-notice{background:rgba(216,163,62,.12);border:1px solid var(--warn);color:#f0cb84;padding:10px 12px;border-radius:6px;font-size:13px;margin:12px 0;}
  .card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--panel2);}
  .card h3{margin:0 0 6px;font-size:14px;}
  .card .meta-line{font-size:12px;color:var(--muted);margin:2px 0;}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);margin-left:6px;}
  .badge.published{color:var(--ok);border-color:var(--ok);}
  .badge.withdrawn{color:var(--danger);border-color:var(--danger);}
  pre.src-view{max-height:220px;overflow:auto;background:#0f1116;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;}
  .mod-item{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;background:#0f1116;}
  .mod-item .mid{font-size:12px;color:var(--muted);}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .small{font-size:12px;color:var(--muted);}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .center{text-align:center;}

  /* Discovery */
  .search-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .search-bar input[type=text]{flex:1;min-width:180px;}
  .filters-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  select.filter{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted);}
  .chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;line-height:1;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .release-card{border:1px solid var(--border);border-radius:10px;padding:16px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s;}
  .release-card:hover,.release-card:focus-visible{border-color:var(--accent);}
  .release-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .release-thumb{width:100%;aspect-ratio:16/9;border-radius:6px;background:linear-gradient(135deg,#2a3346,#1a2030);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);margin-bottom:2px;}
  .release-card h3{margin:0;font-size:14px;}
  .release-card .desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;}
  .tag-pill{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(91,141,239,.15);color:#b9d0fb;border:1px solid transparent;cursor:pointer;}
  .tag-pill:hover{border-color:var(--accent);}
  .lang-badge{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted);}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;object-fit:cover;}
  .avatar-lg{width:72px;height:72px;font-size:26px;}
  .profile-header{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .load-more{display:block;margin:18px auto 0;}
  .compat-badge{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid var(--border);}
  .compat-badge.ok{color:var(--ok);border-color:var(--ok);}
  .compat-badge.warn{color:var(--warn);border-color:var(--warn);}
  .compat-badge.unknown{color:var(--muted);}
  details.tech-details{margin-top:10px;}
  details.tech-details summary{cursor:pointer;color:var(--accent);font-size:12px;}
  a.plain-link{color:var(--accent);text-decoration:none;}
  a.plain-link:hover{text-decoration:underline;}
  .skeleton{background:linear-gradient(90deg,var(--panel2) 25%,#2a2f3d 37%,var(--panel2) 63%);background-size:400% 100%;animation:skeleton-loading 1.4s ease infinite;border-radius:6px;}
  @keyframes skeleton-loading{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  @media (max-width: 600px){
    header{flex-direction:column;align-items:stretch;gap:10px;}
    .top-actions{justify-content:space-between;}
    main{padding:14px 12px 60px;}
    .card-grid{grid-template-columns:1fr;}
    nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    nav button{flex-shrink:0;}
  }
</style>
</head>

    <div class="sub" id="hSub">Publish, sign in, and manage your Community Releases.</div>

  <div class="top-actions">
    <nav id="navBar"></nav>
    <select class="lang" id="langSelect">
      <option value="en-US">English</option>
      <option value="zh-CN">简体中文</option>
    </select>
  </div>
</header>

  };

  let locale = (navigator.language && CATALOG[navigator.language]) ? navigator.language : 'en-US';
  function t(key, params){
    let s = (CATALOG[locale] && CATALOG[locale][key]) || (CATALOG['en-US'][key]) || key;
    if(params){ for(const k in params){ s = s.split('{'+k+'}').join(String(params[k])); } }

  // ===================================================================
  // Structured error codes. Shared code namespace with the Runtime's
  // `runtime.community` client (COMMUNITY_BACKEND_SPEC.md § Error
  // model) plus a small set of Portal-only additions for signup/profile
  // UX that the anonymous-only Runtime client never needs.
  // ===================================================================
  const ERROR_MESSAGES = {
    'en-US': {
      COMMUNITY_NOT_CONFIGURED: 'The Community backend is not configured.',
      COMMUNITY_NETWORK_ERROR: 'Could not reach the Community backend. Check your connection and try again.',

      COMMUNITY_RELEASE_INVALID: 'This file is not a valid Community Release, or exceeds a size/count limit.',
      COMMUNITY_PERMISSION_DENIED: 'You do not have permission to do that.',
      COMMUNITY_EMAIL_CONFIRMATION_REQUIRED: 'Check your email to confirm your account, then sign in.',
      COMMUNITY_PROFILE_INVALID: 'Display name is required (1–60 characters).'
    },

      COMMUNITY_AUTH_FAILED: '登录失败，请检查邮箱和密码。',
      COMMUNITY_RELEASE_NOT_FOUND: '未找到该作品发布。',
      COMMUNITY_RELEASE_WITHDRAWN: '该作品发布已被创作者撤下。',
      COMMUNITY_PUBLISH_FAILED: '发布失败，请重试。',
      COMMUNITY_RELEASE_INVALID: '该文件不是有效的社区作品发布，或超出大小/数量限制。',
      COMMUNITY_PERMISSION_DENIED: '你没有权限执行此操作。',
      COMMUNITY_EMAIL_CONFIRMATION_REQUIRED: '请查收邮件以确认账号，然后登录。',
      COMMUNITY_PROFILE_INVALID: '显示名称为必填项（1–60 个字符）。'
    }
  };
  function errMsg(code){
    return (ERROR_MESSAGES[locale] && ERROR_MESSAGES[locale][code]) || (ERROR_MESSAGES['en-US'][code]) || t('genericError');
  }

  // ===================================================================
  // Session state — Portal-owned, in-memory + this-page-only
  // localStorage persistence (so a reload doesn't sign you out). This
  // key is never read by index.html (a different file, and in
  // production a different origin) and this Portal never writes the
  // token anywhere index.html could observe it (no URL params, no
  // postMessage, no shared storage key, no clipboard).
  // ===================================================================
  let session = null; // {access_token, refresh_token, expires_at, user:{id,email}}

  function loadSession(){
    if(IS_FILE_PROTOCOL){
      // Never restore a session in file:// mode -- and actively remediate
      // any session a non-file:// visit to this same path may have left
      // behind (or that a shared-origin file:// environment exposed),
      // since we know from live testing that this key can be reachable
      // from index.html's storage under file://.
      try{ localStorage.removeItem(SESSION_STORAGE_KEY); }catch(e){}
      session = null;
      return;
    }
    try{
      const raw = localStorage.getItem(SESSION_STORAGE_KEY);
      if(raw) session = JSON.parse(raw);
    }catch(e){ session = null; }
  }
  function saveSession(){
    if(IS_FILE_PROTOCOL){ session = null; return; } // belt-and-suspenders: never persist under file://
    try{
      if(session) localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
      else localStorage.removeItem(SESSION_STORAGE_KEY);
    }catch(e){}
  }

  // ===================================================================
  // Network layer — raw fetch() against Supabase's REST endpoints
  // (GoTrue Auth, PostgREST, Edge Functions). Deliberately NOT the
  // supabase-js SDK: this Portal is meant to stay a small, fully
  // auditable, zero-build, dependency-free file exactly like the
  // Runtime — introducing supabase-js would mean loading a
  // multi-hundred-KB third-party bundle (from a CDN, or vendored) into
  // the one page in this project that holds live Auth tokens. Raw
  // fetch() against documented REST endpoints keeps every network call
  // this page ever makes visible directly in this file. Tradeoff:
  // slightly more boilerplate (manual header/query construction, no
  // built-in retry/refresh helpers) in exchange for zero supply-chain
  // surface and full auditability on the one page most worth auditing.
  // ===================================================================
  function apiUrl(path){ return COMMUNITY_BACKEND_CONFIG.supabaseUrl.replace(/\/$/, '') + path; }

  async function callFetch(path, options){
    if(!COMMUNITY_BACKEND_CONFIG.enabled || !COMMUNITY_BACKEND_CONFIG.supabaseUrl || !COMMUNITY_BACKEND_CONFIG.publishableKey){
      const e = new Error('not configured'); e.code = 'COMMUNITY_NOT_CONFIGURED'; throw e;
    }
    const headers = Object.assign({
      'apikey': COMMUNITY_BACKEND_CONFIG.publishableKey,
      'Content-Type': 'application/json'
    }, (options && options.headers) || {});
    // `anon: true` (used by every public Discovery read) deliberately
    // never attaches a session token, even if one exists -- Explore/
    // Release-detail/Profile must keep working exactly the same whether
    // signed out, signed in, OR signed in with a stale/expired token
    // sitting in localStorage. A bad Bearer token makes PostgREST reject
    // the whole request outright (it does not silently fall back to the
    // apikey's anon role), which would otherwise break public browsing
    // for any signed-in user with an expired session -- found live
    // during testing and fixed by never sending a token for these reads.
    if(session && session.access_token && !headers.Authorization && !(options && options.anon)){
      headers.Authorization = 'Bearer ' + session.access_token;
    }
    let resp;
    try{
      resp = await fetch(apiUrl(path), Object.assign({}, options, {headers}));
    }catch(netErr){
      const e = new Error('network'); e.code = 'COMMUNITY_NETWORK_ERROR'; throw e;
    }
    return resp;
  }

  function assertAuthAllowed(){
    if(IS_FILE_PROTOCOL){
      const e = new Error('Community sign-in is disabled in file:// mode.');
      e.code = 'COMMUNITY_AUTH_DISABLED_FILE_PROTOCOL';
      throw e;
    }
  }

  async function authSignUp(email, password){
    assertAuthAllowed();
    const resp = await callFetch('/auth/v1/signup', {method:'POST', body: JSON.stringify({email, password})});
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok){
      const e = new Error(data.msg || data.error_description || 'signup failed'); e.code = 'COMMUNITY_AUTH_FAILED'; throw e;
    }
    // Projects with email confirmation enabled return a user but no
    // access_token until the user clicks the confirmation link.
    if(data.access_token){
      session = {access_token: data.access_token, refresh_token: data.refresh_token, user: data.user};
      saveSession();
      return {confirmed: true};
    }
    return {confirmed: false};
  }

  async function authSignIn(email, password){
    assertAuthAllowed();
    const resp = await callFetch('/auth/v1/token?grant_type=password', {method:'POST', body: JSON.stringify({email, password})});
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok){
      const e = new Error(data.msg || data.error_description || 'signin failed'); e.code = 'COMMUNITY_AUTH_FAILED'; throw e;
    }
    session = {access_token: data.access_token, refresh_token: data.refresh_token, user: data.user};
    saveSession();
    return session;
  }

  async function authSignOut(){
    if(session && session.access_token){
      try{ await callFetch('/auth/v1/logout', {method:'POST', headers:{Authorization:'Bearer '+session.access_token}}); }catch(e){}
    }
    session = null;
    saveSession();
  }

  async function restRequest(path, options){
    const resp = await callFetch('/rest/v1' + path, options);
    const text = await resp.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
    if(!resp.ok){
      let code = 'COMMUNITY_PUBLISH_FAILED';
      if(resp.status === 401) code = 'COMMUNITY_AUTH_REQUIRED';
      else if(resp.status === 403) code = 'COMMUNITY_PERMISSION_DENIED';
      else if(resp.status === 404) code = 'COMMUNITY_RELEASE_NOT_FOUND';
      const e = new Error((data && data.message) || 'request failed'); e.code = code; e.status = resp.status; throw e;
    }
    return data;
  }

  async function publishViaEdgeFunction(releaseText){
    assertAuthAllowed();
    if(!session || !session.access_token){ const e = new Error('auth required'); e.code = 'COMMUNITY_AUTH_REQUIRED'; throw e; }
    const resp = await callFetch('/functions/v1/publish-release', {
      method: 'POST',
      headers: {Authorization: 'Bearer ' + session.access_token},
      body: JSON.stringify({releaseText})
    });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok){
      const code = (data && data.error && data.error.code) || 'COMMUNITY_PUBLISH_FAILED';
      const e = new Error((data && data.error && data.error.message) || 'publish failed'); e.code = code; throw e;
    }
    return data.remoteId;
  }

  // ===================================================================
  // CommunityClient — the internal public-read layer for Discovery
  // (spec § 44/45). Every method here is an anonymous-capable, RLS-safe
  // read against `community_release_cards` (see
  // supabase/migrations/20260813132449_community_discovery_read_model.sql)
  // or `profiles`. None of this is exposed as `api.community` -- it is
  // purely internal to this Portal page, exactly like the Runtime's own
  // `runtime.community` remote client is internal to index.html.
  //
  // Query contract (spec § 45), documented once here rather than
  // scattered across UI code:
  //
  // listReleases({q, language, tag, cursor, limit=20})
  //   -> {rows, nextCursor}
  //   Filters: `is_published=eq.true` ALWAYS explicit (see note below),
  //   optional `q` (ILIKE substring over title/description/
  //   author_display_name, PostgREST `or=(...)`), optional `language`
  //   (`eq.`), optional `tag` (resolved via a small indexed lookup
  //   against community_release_tags first, then `id=in.(...)` against
  //   the card view -- see resolveTagReleaseIds below; deliberately NOT
  //   filtering the view's own aggregated `tags` array column, which
  //   has no supporting index).
  //   Pagination: keyset/cursor on (published_at, id) DESC, page size
  //   DISCOVERY_PAGE_SIZE (20) -- see § "Pagination model" in
  //   COMMUNITY_DISCOVERY_SPEC.md for why this avoids the classic
  //   offset-pagination duplicate/skip problem under concurrent inserts.
  //   Returned fields: every column on community_release_cards (id,
  //   title, description, author_display_name, language, generation,
  //   parent_release_id, parent_title, runtime/api/vmp/format versions,
  //   published_at, mod_count, tags[], remix_count).
  //   RLS: `community_release_cards` is `security_invoker` -- an
  //   anonymous caller only ever sees rows where
  //   community_releases.is_published = true (RLS on the base table);
  //   the explicit `is_published=eq.true` filter here additionally
  //   keeps a SIGNED-IN caller's own unpublished drafts out of the
  //   public Explore feed (RLS alone would let an owner see their own
  //   unpublished rows too -- correct for "My Releases", wrong for
  //   public Explore).
  //   Errors: COMMUNITY_NOT_CONFIGURED, COMMUNITY_NETWORK_ERROR.
  //
  // getReleaseDetail(remoteId) -> {card, snapshotText} | throws
  //   COMMUNITY_RELEASE_NOT_FOUND (covers both "never existed" and
  //   "withdrawn" -- RLS makes an anonymous caller unable to distinguish
  //   the two, so this client does not pretend to either).
  //
  // getChildren(remoteId) -> rows[] (direct published remixes only,
  //   `parent_release_id=eq.<id>&is_published=eq.true`).
  //
  // getProfile(userId) -> row | null (public: `profiles` SELECT policy
  //   is `using (true)`, never exposes auth.users/email).
  //
  // listProfileReleases(userId) -> rows[] (published only --
  //   `creator_id=eq.<id>&is_published=eq.true`; a profile owner's own
  //   unpublished Releases are deliberately never shown here, only in
  //   My Releases under their own authenticated session).
  // ===================================================================

  const DISCOVERY_PAGE_SIZE = 20;

  function ilikeValue(term){
    // PostgREST quoted-value syntax: wrap in double quotes and escape
    // backslash/quote so the value can safely contain `,`/`)`/`(` --
    // the characters that are structurally significant inside an
    // `or=(...)` filter group -- without breaking the filter grammar.
    // This is string ESCAPING for a documented query-parameter syntax,
    // not manual SQL construction -- PostgREST itself remains the only
    // thing that ever builds the underlying SQL.
    //
    // The escaped text is THEN percent-encoded (encodeURIComponent) --
    // found live during attack testing (spec § 77) that a raw `%` (or a
    // space, `&`, `#`, ...) in the search term produced a malformed URL
    // that made `fetch()` itself throw, surfacing as a false
    // COMMUNITY_NETWORK_ERROR for an ordinary search term like "100%
    // off". PostgREST percent-decodes the query string before applying
    // its own `"..."`/escape grammar, so decode-then-parse still sees
    // exactly the same `\"`-escaped text -- encoding is transparent to
    // the filter semantics. The structural `"`/`*` wrapper characters
    // are added AFTER encoding and stay literal, since PostgREST's own
    // parser must see them unescaped.
    const escaped = String(term).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    return '"*' + encodeURIComponent(escaped) + '*"';
  }

  async function resolveTagReleaseIds(tag){
    const rows = await restRequest('/community_release_tags?tag=eq.' + encodeURIComponent(tag) + '&select=release_id', {method:'GET', anon:true});
    return (rows || []).map(r => r.release_id);
  }

  async function listReleases({q, language, tag, cursor, limit} = {}){
    limit = limit || DISCOVERY_PAGE_SIZE;
    const params = ['is_published=eq.true', 'select=*', 'order=published_at.desc,id.desc', 'limit=' + limit];

    if(q && q.trim()){
      const v = ilikeValue(q.trim());
      params.push('or=(title.ilike.' + v + ',description.ilike.' + v + ',author_display_name.ilike.' + v + ')');
    }
    if(language){ params.push('language=eq.' + encodeURIComponent(language)); }
    if(tag){
      const ids = await resolveTagReleaseIds(tag);
      if(ids.length === 0) return {rows: [], nextCursor: null};
      params.push('id=in.(' + ids.join(',') + ')');
    }
    if(cursor){
      params.push('or=(published_at.lt.' + encodeURIComponent(cursor.published_at) + ',and(published_at.eq.' + encodeURIComponent(cursor.published_at) + ',id.lt.' + cursor.id + '))');
    }

    const rows = await restRequest('/community_release_cards?' + params.join('&'), {method:'GET', anon:true});
    const nextCursor = (rows && rows.length === limit) ? {published_at: rows[rows.length-1].published_at, id: rows[rows.length-1].id} : null;
    return {rows: rows || [], nextCursor};
  }

  async function getReleaseDetail(remoteId){
    const rows = await restRequest('/community_release_cards?id=eq.' + encodeURIComponent(remoteId) + '&is_published=eq.true&select=*', {method:'GET', anon:true});
    if(!rows || !rows.length){ const e = new Error('not found'); e.code = 'COMMUNITY_RELEASE_NOT_FOUND'; throw e; }
    const card = rows[0];
    const snapRows = await restRequest('/community_releases?id=eq.' + encodeURIComponent(remoteId) + '&select=snapshot_text', {method:'GET', anon:true});
    const snapshotText = (snapRows && snapRows[0] && snapRows[0].snapshot_text) || null;
    return {card, snapshotText};
  }

  async function getChildren(remoteId){
    return await restRequest('/community_release_cards?parent_release_id=eq.' + encodeURIComponent(remoteId) + '&is_published=eq.true&select=id,title,author_display_name,generation,mod_count,tags,language,published_at&order=published_at.desc', {method:'GET', anon:true});
  }

  async function getPublicProfile(userId){
    const rows = await restRequest('/profiles?user_id=eq.' + encodeURIComponent(userId) + '&select=user_id,display_name,bio,avatar_url,created_at', {method:'GET', anon:true});
    return (rows && rows[0]) || null;
  }

  async function listProfileReleases(userId){
    return await restRequest('/community_release_cards?creator_id=eq.' + encodeURIComponent(userId) + '&is_published=eq.true&select=*&order=published_at.desc', {method:'GET', anon:true});
  }

  // ===================================================================
  // Local .vrelease structural validation — mirrors
  // COMMUNITY_RELEASE_SPEC.md § 3/18 and the Edge Function's own
  // (authoritative) checks. This is a client-side courtesy check only:
  // the backend always re-validates independently and is never trusted
  // to have been bypassed by this preview passing.
  // ===================================================================
  function byteLength(s){ return new TextEncoder().encode(s).length; }

  function validateReleaseLocally(raw){
    if(byteLength(raw) > MAX_SNAPSHOT_BYTES) return {ok:false};
    let release;
    try{ release = JSON.parse(raw); }catch(e){ return {ok:false}; }
    if(release.format !== 'voxel-release') return {ok:false};
    if(!release.releaseId) return {ok:false};
    if(!release.game || typeof release.game.title !== 'string' || !release.game.title || release.game.title.length > MAX_TITLE_LEN) return {ok:false};
    if(typeof release.game.description === 'string' && release.game.description.length > MAX_DESCRIPTION_LEN) return {ok:false};
    if(!Array.isArray(release.mods) || release.mods.length === 0 || release.mods.length > MAX_MOD_COUNT) return {ok:false};
    for(const m of release.mods){
      if(!m || typeof m.source !== 'string' || !m.source || byteLength(m.source) > MAX_MOD_SOURCE_BYTES) return {ok:false};
      if(!m.manifest || typeof m.manifest.id !== 'string' || !m.manifest.id) return {ok:false};
    }
    const md = release.metadata || {};
    if(md.tags !== undefined && (!Array.isArray(md.tags) || md.tags.length > MAX_TAG_COUNT || md.tags.some(x=>typeof x!=='string' || x.length>MAX_TAG_LEN))) return {ok:false};
    if(typeof md.releaseNote === 'string' && md.releaseNote.length > MAX_RELEASE_NOTE_LEN) return {ok:false};
    return {ok:true, release};
  }

  // ===================================================================
  // Rendering helpers — textContent ONLY for any untrusted string
  // (title/description/tags/mod source/snapshot). This page must never
  // pass release-derived content through innerHTML, and must never
  // eval/new Function/dynamically create <script> from Mod source. Mod
  // source is displayed strictly as read-only text for inspection.
  // ===================================================================
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function showMsg(container, kind, text){
    clear(container);
    if(!text) return;
    const m = el('div', 'msg ' + kind, text);
    container.appendChild(m);
  }

  // Like showMsg, but APPENDS to a larger composed view instead of
  // clearing the whole container first -- for an inline status line
  // inside a page section (e.g. "Loading…"/"No Remixes yet." partway
  // down a Release detail page) that must not wipe unrelated content
  // rendered earlier in the same panel.
  function appendMsg(container, kind, text){
    container.appendChild(el('div', 'msg ' + kind, text));
  }

  // A brief, self-dismissing toast for an action confirmation (e.g.
  // "Link copied.") that happens mid-page and must not disturb any
  // other content already on screen.
  function toast(text){
    const t_ = el('div', 'msg ok', text);
    t_.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.4);';
    document.body.appendChild(t_);
    setTimeout(()=>{ if(t_.parentNode) t_.parentNode.removeChild(t_); }, 2200);
  }

  function downloadText(filename, text){
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  async function copyToClipboard(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      try{
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      }catch(e2){ return false; }
    }
  }

  // Safe download filename from a title (spec § 62): strip slashes,
  // control chars, and other reserved filesystem characters; fall back
  // to a short-id-based name if the title sanitizes away to nothing
  // (e.g. a title that is 100% emoji/symbols).
  function releaseFilename(title, id){
    const base = String(title || '').trim().toLowerCase()
      .replace(/[\/\\?%*:|"<>\x00-\x1f]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
    if(base) return base + '.vrelease';
    const shortId = String(id || '').slice(0, 8) || 'unknown';
    return 'release-' + shortId + '.vrelease';
  }

  // ===================================================================
  // URL-input validation (spec § 40: treat release id / profile id / q /
  // tag / language as untrusted). These only gate what this Portal will
  // even attempt to query with -- the database/RLS remains the actual
  // authority (spec § 29) regardless of what passes here.
  // ===================================================================
  const UUID_RE = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
  function isValidId(v){ return typeof v === 'string' && v.length <= 64 && UUID_RE.test(v); }
  function sanitizeQueryText(v, maxLen){
    if(typeof v !== 'string') return '';
    return v.slice(0, maxLen || 100);
  }

  // Only https: (plus http: for localhost dev) is ever allowed for a
  // rendered external link (spec § 42) -- rejects javascript:/data:/etc.
  function isSafeExternalUrl(url){
    try{
      const u = new URL(url, location.href);
      if(u.protocol === 'https:') return true;
      if(u.protocol === 'http:' && (u.hostname === 'localhost' || u.hostname === '127.0.0.1')) return true;
      return false;
    }catch(e){ return false; }
  }

  function makeExternalLink(url, text){
    const a = document.createElement('a');
    if(isSafeExternalUrl(url)){
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    }
    a.className = 'plain-link';
    a.textContent = text !== undefined ? text : url;
    return a;
  }

  // Compatibility label (spec § 16) -- version compatibility ONLY, never
  // a safety/trust rating. Compares a Release's recorded api/vmp version
  // against what THIS Portal knows the current Runtime to require.
  function compatibilityOf(card){
    if(typeof card.api_version !== 'number' || typeof card.vmp_version !== 'number'){
      return {label: 'compatUnknown', cls: 'unknown'};
    }
    if(card.api_version === KNOWN_API_VERSION && card.vmp_version === KNOWN_VMP_VERSION){
      return {label: 'compatCompatible', cls: 'ok'};
    }
    if(card.api_version > KNOWN_API_VERSION || card.vmp_version > KNOWN_VMP_VERSION){
      return {label: 'compatNewerRuntime', cls: 'warn'};
    }
    return {label: 'compatUnsupportedApi', cls: 'warn'};
  }

  function formatDate(iso){
    if(!iso) return '';
    try{
      return new Intl.DateTimeFormat(locale, {dateStyle:'medium', timeStyle:'short'}).format(new Date(iso));
    }catch(e){ return iso; }
  }

  function initialsFor(name){
    const s = String(name || '?').trim();
    return s ? s[0].toUpperCase() : '?';
  }

  function renderAvatar(displayName, avatarUrl, large){
    if(avatarUrl && isSafeExternalUrl(avatarUrl)){
      const img = document.createElement('img');
      img.className = 'avatar' + (large ? ' avatar-lg' : '');
      img.src = avatarUrl; img.alt = '';
      img.referrerPolicy = 'no-referrer';
      return img;
    }
    const div = el('div', 'avatar' + (large ? ' avatar-lg' : ''), initialsFor(displayName));
    return div;
  }

  // ===================================================================
  // Views
  // ===================================================================
  const root = document.getElementById('mainRoot');

  // ===================================================================
  // Routing (spec § 12/13) -- shareable URLs via query parameters, no
  // SPA framework. `?release=<uuid>` and `?profile=<uuid>` are page
  // routes (mutually exclusive with each other and with Explore's own
  // `?q=&lang=&tag=` filter state); everything else (auth/profile-edit/
  // publish/my-releases) is a private, non-shareable tab reached only
  // via nav clicks, which clear the query string.
  // ===================================================================
  let currentTab = 'explore';
  let exploreState = {q:'', language:'', tag:'', rows:[], nextCursor:null, loading:false, error:null, lastQueryKey:null, onDraw:null};
  let releaseViewState = {id:null, loading:false, error:null, card:null, snapshotText:null, children:null, onDraw:null};
  let profileViewState = {id:null, loading:false, error:null, profile:null, releases:null, onDraw:null};

  function parseRoute(){
    const params = new URLSearchParams(location.search);
    const releaseId = params.get('release');
    const profileId = params.get('profile');
    if(releaseId && isValidId(releaseId)){
      currentTab = 'release';
      if(releaseViewState.id !== releaseId){
        releaseViewState = {id: releaseId, loading:true, error:null, card:null, snapshotText:null, children:null, onDraw:null};
        loadReleaseView(releaseId);
      }
      return;
    }
    if(profileId && isValidId(profileId)){
      currentTab = 'profileView';
      if(profileViewState.id !== profileId){
        profileViewState = {id: profileId, loading:true, error:null, profile:null, releases:null, onDraw:null};
        loadProfileView(profileId);
      }
      return;
    }
    currentTab = 'explore';
    exploreState.q = sanitizeQueryText(params.get('q') || '', 100);
    exploreState.language = params.get('lang') || '';
    exploreState.tag = sanitizeQueryText(params.get('tag') || '', 32);
  }

  // Pushes new URL state for a route that should be shareable/
  // bookmarkable (explore filters, release, profile) and re-renders.
  function navigateTo(patch){
    const usp = new URLSearchParams();
    const merged = Object.assign({q: exploreState.q, lang: exploreState.language, tag: exploreState.tag}, patch);
    if(patch.release){ usp.set('release', patch.release); }
    else if(patch.profile){ usp.set('profile', patch.profile); }
    else{
      if(merged.q) usp.set('q', merged.q);
      if(merged.lang) usp.set('lang', merged.lang);
      if(merged.tag) usp.set('tag', merged.tag);
    }
    const qs = usp.toString();
    history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
    parseRoute();
    renderAll();
  }

  // Private, non-shareable tabs (spec § 4) -- always clears any
  // release/profile/filter query state.
  function goToTab(tabId){
    currentTab = tabId;
    history.pushState(null, '', location.pathname);
    renderAll();
  }

  window.addEventListener('popstate', ()=>{ parseRoute(); renderAll(); });

  function renderNav(){
    const nav = document.getElementById('navBar');
    clear(nav);
    const exploreBtn = document.createElement('button');
    exploreBtn.textContent = t('navExplore');
    if(currentTab === 'explore') exploreBtn.className = 'active';
    exploreBtn.onclick = ()=>navigateTo({});
    nav.appendChild(exploreBtn);

    if(session && session.user){
      [['mine','navMine'], ['publish','navPublish'], ['profile','navProfile']].forEach(([id, key])=>{
        const b = document.createElement('button');
        b.textContent = t(key);
        if(currentTab === id) b.className = 'active';
        b.onclick = ()=>goToTab(id);
        nav.appendChild(b);
      });
      const signOutBtn = document.createElement('button');
      signOutBtn.textContent = t('navSignOut');
      signOutBtn.onclick = async ()=>{ await authSignOut(); goToTab('explore'); };
      nav.appendChild(signOutBtn);
    } else {
      const signInBtn = document.createElement('button');
      signInBtn.textContent = t('navSignIn');
      if(currentTab === 'auth') signInBtn.className = 'active';
      signInBtn.onclick = ()=>goToTab('auth');
      nav.appendChild(signInBtn);
    }
  }

  function renderHeader(){
    document.getElementById('hTitle').textContent = t('title');
    document.getElementById('hSub').textContent = t('subtitle');
    if(currentTab === 'explore') document.title = t('explore.pageTitle');
    else if(currentTab === 'release' && releaseViewState.card) document.title = releaseViewState.card.title + t('release.pageTitleSuffix');
    else if(currentTab === 'profileView' && profileViewState.profile) document.title = (profileViewState.profile.display_name || '?') + t('profile.pageTitleSuffix');
    else document.title = t('title');

  // edit, publish, my releases) whenever IS_FILE_PROTOCOL is true.

  function viewAuth(){
    const panel = el('div', 'panel');
    if(renderFileProtocolNoticeIfNeeded(panel)){ root.appendChild(panel); return; }
    if(session && session.user){
      panel.appendChild(el('h2', null, t('signIn')));
      const msg = el('div');
      panel.appendChild(msg);
      showMsg(msg, 'ok', t('signedInAs', {email: session.user.email || ''}));
      const out = el('button', 'btn secondary', t('signOut'));
      out.style.marginTop = '10px';
      out.onclick = async ()=>{
        await authSignOut();
        currentTab = 'auth';
        renderAll();
      };
      panel.appendChild(out);
      root.appendChild(panel);
      return;
    }

    let mode = 'signin';
    const wrap = el('div');

    function draw(){
      clear(wrap);
      const h = el('h2', null, mode === 'signin' ? t('signIn') : t('signUp'));
      wrap.appendChild(h);

      const emailLabel = el('label', 'field-label', t('email'));
      const emailInput = document.createElement('input');
      emailInput.type = 'email'; emailInput.autocomplete = 'email';
      const passLabel = el('label', 'field-label', t('password'));
      const passInput = document.createElement('input');
      passInput.type = 'password'; passInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';

      wrap.appendChild(emailLabel); wrap.appendChild(emailInput);
      wrap.appendChild(passLabel); wrap.appendChild(passInput);

      const msgBox = el('div');
      wrap.appendChild(msgBox);

      const row = el('div', 'row');
      row.style.marginTop = '12px';
      const submitBtn = el('button', 'btn', mode === 'signin' ? t('signInBtn') : t('signUpBtn'));
      row.appendChild(submitBtn);
      wrap.appendChild(row);

      const switchLine = el('div', 'small');
      switchLine.style.marginTop = '10px';
      const switchBtn = document.createElement('a');
      switchBtn.href = '#';
      switchBtn.textContent = mode === 'signin' ? t('needAccount') : t('alreadyHaveAccount');
      switchBtn.style.color = 'var(--accent)';
      switchBtn.onclick = (ev)=>{ ev.preventDefault(); mode = mode === 'signin' ? 'signup' : 'signin'; draw(); };
      switchLine.appendChild(switchBtn);
      wrap.appendChild(switchLine);

      submitBtn.onclick = async ()=>{
        const email = emailInput.value.trim();
        const password = passInput.value;
        submitBtn.disabled = true;
        showMsg(msgBox, 'info', t('loading'));
        try{
          if(mode === 'signin'){
            await authSignIn(email, password);
            goToTab('explore');
          } else {
            const result = await authSignUp(email, password);
            if(result.confirmed){
              goToTab('explore');
            } else {
              showMsg(msgBox, 'warn', errMsg('COMMUNITY_EMAIL_CONFIRMATION_REQUIRED'));
              mode = 'signin';
            }
          }
        }catch(e){
          showMsg(msgBox, 'error', errMsg(e.code) || e.message);
        }finally{
          submitBtn.disabled = false;
        }
      };
    }
    draw();
    panel.appendChild(wrap);
    root.appendChild(panel);
  }

  function viewProfile(){
    const panel = el('div', 'panel');
    if(renderFileProtocolNoticeIfNeeded(panel)){ root.appendChild(panel); return; }
    panel.appendChild(el('h2', null, t('profileTitle')));
    if(!session || !session.user){

    }

    const bioLabel = el('label', 'field-label', t('bio'));

    panel.appendChild(bioLabel); panel.appendChild(bioInput);

    saveBtn.style.marginTop = '12px';
    panel.appendChild(saveBtn);

    (async ()=>{

        const rows = await restRequest('/profiles?user_id=eq.' + encodeURIComponent(session.user.id) + '&select=display_name,bio', {method:'GET'});

        });
        showMsg(msgBox, 'ok', t('profileSaved'));
      }catch(e){

  function renderModList(container, mods){
    mods.forEach(m=>{
      const item = el('div', 'mod-item');
      const idLine = el('div', 'mid mono', (m.manifest && m.manifest.id) || '?');
      item.appendChild(idLine);
      const pre = document.createElement('pre');
      pre.className = 'src-view';
      pre.textContent = (m.source || ''); // textContent only -- never executed, never innerHTML
      item.appendChild(pre);
      container.appendChild(item);
    });

  function viewPublish(){
    const panel = el('div', 'panel');
    if(renderFileProtocolNoticeIfNeeded(panel)){ root.appendChild(panel); return; }
    panel.appendChild(el('h2', null, t('publishTitle')));
    if(!session || !session.user){
      appendMsg(panel, 'warn', errMsg('COMMUNITY_AUTH_REQUIRED'));
      root.appendChild(panel);
      return;
    }
    panel.appendChild(el('div', 'small', t('publishHint')));

    const msgBox = el('div'); panel.appendChild(msgBox);

    const fileLabel = el('label', 'field-label', t('chooseFile'));
    const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = '.vrelease,application/json';
    panel.appendChild(fileLabel); panel.appendChild(fileInput);

    const previewBox = el('div');
    panel.appendChild(previewBox);

    let currentRaw = null;
    let currentRelease = null;

    fileInput.onchange = ()=>{
      clear(previewBox);
      currentRaw = null; currentRelease = null;
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const raw = String(reader.result || '');
        const validated = validateReleaseLocally(raw);
        if(!validated.ok){
          showMsg(msgBox, 'error', errMsg('COMMUNITY_RELEASE_INVALID'));
          return;
        }
        showMsg(msgBox, '', '');
        currentRaw = raw;
        currentRelease = validated.release;
        renderPreview();
      };
      reader.onerror = ()=>{ showMsg(msgBox, 'error', errMsg('COMMUNITY_RELEASE_INVALID')); };
      reader.readAsText(file);
    };

    function renderPreview(){
      clear(previewBox);
      const rel = currentRelease;
      const card = el('div', 'card');
      card.appendChild(el('h3', null, rel.game.title));
      if(rel.game.description) card.appendChild(el('div', 'meta-line', rel.game.description));
      if(rel.game.authorDisplayName) card.appendChild(el('div', 'meta-line', rel.game.authorDisplayName));
      const prov = rel.provenance || {};
      card.appendChild(el('div', 'meta-line', prov.parentReleaseId ? t('remixOf', {title: prov.parentTitle || '?'}) : t('original')));
      card.appendChild(el('div', 'meta-line', t('modCount', {count: rel.mods.length})));
      if(rel.metadata && rel.metadata.language) card.appendChild(el('div', 'meta-line', t('language') + ': ' + rel.metadata.language));
      if(rel.metadata && Array.isArray(rel.metadata.tags) && rel.metadata.tags.length) card.appendChild(el('div', 'meta-line', t('tags') + ': ' + rel.metadata.tags.join(', ')));
      if(rel.metadata && rel.metadata.releaseNote) card.appendChild(el('div', 'meta-line', t('releaseNote') + ': ' + rel.metadata.releaseNote));
      previewBox.appendChild(card);

      const notice1 = el('div', 'trust-notice', t('previewHistoryExcluded'));
      previewBox.appendChild(notice1);
      const notice2 = el('div', 'trust-notice', t('previewTrust'));
      previewBox.appendChild(notice2);

      previewBox.appendChild(el('div', 'field-label', t('mods')));
      renderModList(previewBox, rel.mods);

      const publishBtn = el('button', 'btn', t('publishBtn'));
      publishBtn.style.marginTop = '10px';
      publishBtn.onclick = async ()=>{
        publishBtn.disabled = true;
        showMsg(msgBox, 'info', t('publishing'));
        try{
          const remoteId = await publishViaEdgeFunction(currentRaw);
          showMsg(msgBox, 'ok', t('publishOk', {id: remoteId}));
        }catch(e){
          showMsg(msgBox, 'error', errMsg(e.code) || e.message);
        }finally{
          publishBtn.disabled = false;
        }
      };
      previewBox.appendChild(publishBtn);
    }

    root.appendChild(panel);
  }

  function releaseCard(row, opts){
    const card = el('div', 'card');
    const h = el('h3', null, row.title);
    const badge = el('span', 'badge ' + (row.is_published ? 'published' : 'withdrawn'), row.is_published ? t('published') : t('withdrawn'));
    h.appendChild(badge);
    card.appendChild(h);
    if(row.description) card.appendChild(el('div', 'meta-line', row.description));
    card.appendChild(el('div', 'meta-line mono', row.id));
    card.appendChild(el('div', 'meta-line', t('generationLabel', {gen: row.generation})));
    if(row.parent_release_id) card.appendChild(el('div', 'meta-line', t('parentLabel', {id: row.parent_release_id})));
    if(row.language) card.appendChild(el('div', 'meta-line', t('language') + ': ' + row.language));
    if(row.published_at) card.appendChild(el('div', 'meta-line', row.published_at));
    if(opts && opts.actions) opts.actions(card, row);
    return card;
  }

  function viewMine(){
    const panel = el('div', 'panel');
    if(renderFileProtocolNoticeIfNeeded(panel)){ root.appendChild(panel); return; }
    panel.appendChild(el('h2', null, t('mineTitle')));
    if(!session || !session.user){
      appendMsg(panel, 'warn', errMsg('COMMUNITY_AUTH_REQUIRED'));
      root.appendChild(panel);
      return;
    }
    const msgBox = el('div'); panel.appendChild(msgBox);
    const listBox = el('div'); panel.appendChild(listBox);
    root.appendChild(panel);

    showMsg(msgBox, 'info', t('loading'));
    restRequest('/community_releases?creator_id=eq.' + encodeURIComponent(session.user.id) +
      '&select=id,client_release_id,title,description,language,generation,parent_release_id,is_published,created_at,published_at,snapshot_text&order=created_at.desc', {method:'GET'})
    .then(rows=>{
      showMsg(msgBox, '', '');
      clear(listBox);
      if(!rows || !rows.length){ showMsg(msgBox, 'info', t('mineEmpty')); return; }
      rows.forEach(row=>{
        const card = releaseCard(row, {actions: (card, row)=>{
          const actions = el('div', 'actions');

          const copyBtn = el('button', 'btn secondary', t('copyId'));
          copyBtn.onclick = async ()=>{
            const ok = await copyToClipboard(row.id);
            if(ok) showMsg(msgBox, 'ok', t('copied'));
          };
          actions.appendChild(copyBtn);

          const dlBtn = el('button', 'btn secondary', t('download'));
          dlBtn.onclick = ()=>{
            downloadText(releaseFilename(row.title, row.id), row.snapshot_text);
          };
          actions.appendChild(dlBtn);

          if(row.is_published){
            const unpubBtn = el('button', 'btn danger', t('unpublish'));
            unpubBtn.onclick = async ()=>{
              if(!confirm(t('unpublishConfirm'))) return;
              unpubBtn.disabled = true;
              try{
                assertAuthAllowed();
                await restRequest('/community_releases?id=eq.' + encodeURIComponent(row.id), {
                  method: 'PATCH',
                  headers: {Prefer: 'return=minimal'},
                  body: JSON.stringify({is_published: false})
                });
                showMsg(msgBox, 'ok', t('unpublished'));
                viewMineRefresh();
              }catch(e){
                showMsg(msgBox, 'error', errMsg(e.code) || e.message);
                unpubBtn.disabled = false;
              }
            };
            actions.appendChild(unpubBtn);
          }

          card.appendChild(actions);
        }});
        listBox.appendChild(card);
      });
    })
    .catch(e=>{ showMsg(msgBox, 'error', errMsg(e.code) || e.message); });

    function viewMineRefresh(){ renderAll(); }
  }

  // ===================================================================
  // Discovery card (grid) -- the reusable Release card view model (spec
  // § 6). Shows title/author/description/tags/language/mod count/
  // published time/generation-remix indicator/parent title. Never shows
  // the raw UUID prominently. Whole card is one click target (spec § 56)
  // navigating to the Release detail route; nested interactive elements
  // (tag pills) stop propagation so clicking a tag filters Explore
  // instead of also opening the card.
  // ===================================================================
  function discoveryCardEl(card){
    const el_ = el('div', 'release-card');
    el_.tabIndex = 0;
    el_.setAttribute('role', 'link');
    el_.setAttribute('aria-label', card.title);

    const thumb = el('div', 'release-thumb', '🎮'); // spec § 7: no screenshot requirement yet -- clean placeholder only
    el_.appendChild(thumb);

    el_.appendChild(el('h3', null, card.title));
    if(card.description) el_.appendChild(el('div', 'desc', card.description));

    const metaLine = el('div', 'meta-line');
    const bits = [];
    if(card.author_display_name) bits.push(card.author_display_name);
    bits.push(t('modCount', {count: card.mod_count}));
    metaLine.textContent = bits.join(' · ');
    el_.appendChild(metaLine);

    const provLine = el('div', 'meta-line');
    provLine.textContent = card.parent_release_id
      ? t('release.remixOfTitle', {title: card.parent_title || '?'})
      : (card.generation > 0 ? t('release.remix', {gen: card.generation}) : t('release.original'));
    el_.appendChild(provLine);

    const bottomRow = el('div', 'row');
    if(card.language){
      const badge = el('span', 'lang-badge', languageLabel(card.language));
      bottomRow.appendChild(badge);
    }
    if(Array.isArray(card.tags) && card.tags.length){
      const tagRow = el('div', 'tag-row');
      card.tags.slice(0, 4).forEach(tag=>{
        const pill = el('span', 'tag-pill', tag);
        pill.onclick = (ev)=>{ ev.stopPropagation(); navigateExplore({tag}); };
        tagRow.appendChild(pill);
      });
      bottomRow.appendChild(tagRow);
    }
    el_.appendChild(bottomRow);

    const openCard = ()=>navigateTo({release: card.id});
    el_.addEventListener('click', openCard);
    el_.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openCard(); } });

    return el_;
  }

  function languageLabel(lang){
    if(lang === 'zh-CN') return '简体中文';
    if(lang === 'en-US') return 'English';
    return lang;
  }

  // ===================================================================
  // Explore (spec § 5/8/10/11/12) -- the Community landing page. Works
  // fully signed-out. Search box + language/tag filters + a single
  // deterministic "Latest" list (published_at DESC, no ranking
  // algorithm) + keyset pagination via a "Load more" button. All filter
  // state lives in the URL (?q=&lang=&tag=) so the page is shareable and
  // survives a refresh.
  // ===================================================================
  function viewExplore(){
    const panel = el('div', 'panel');
    panel.appendChild(el('h2', null, t('explore.latest')));

    const searchBar = el('div', 'search-bar');
    const searchInput = document.createElement('input');
    searchInput.type = 'text'; searchInput.placeholder = t('explore.searchPlaceholder');
    searchInput.value = exploreState.q || '';
    searchInput.maxLength = 100;
    const searchForm = document.createElement('form');
    searchForm.style.display = 'contents';
    searchForm.appendChild(searchInput);
    const searchBtn = el('button', 'btn', t('explore.searchButton'));
    searchBtn.type = 'submit';
    searchForm.appendChild(searchBtn);
    searchForm.addEventListener('submit', (ev)=>{
      ev.preventDefault();
      navigateExplore({q: sanitizeQueryText(searchInput.value, 100)});
    });
    searchBar.appendChild(searchForm);
    panel.appendChild(searchBar);

    const filtersBar = el('div', 'filters-bar');
    const langSelect = document.createElement('select'); langSelect.className = 'filter';
    const allOpt = document.createElement('option'); allOpt.value = ''; allOpt.textContent = t('filters.allLanguages');
    langSelect.appendChild(allOpt);
    ['zh-CN', 'en-US'].forEach(code=>{
      const o = document.createElement('option'); o.value = code; o.textContent = languageLabel(code);
      if(exploreState.language === code) o.selected = true;
      langSelect.appendChild(o);
    });
    langSelect.addEventListener('change', ()=>{ navigateExplore({language: langSelect.value}); });
    filtersBar.appendChild(langSelect);

    if(exploreState.tag){
      const chip = el('span', 'chip');
      const chipText = document.createElement('span'); chipText.textContent = t('filters.tagLabel') + ': ' + exploreState.tag;
      chip.appendChild(chipText);
      const clearBtn = document.createElement('button'); clearBtn.textContent = '×'; clearBtn.setAttribute('aria-label', t('filters.clearTag', {tag: exploreState.tag}));
      clearBtn.onclick = ()=>navigateExplore({tag: ''});
      chip.appendChild(clearBtn);
      filtersBar.appendChild(chip);
    }
    panel.appendChild(filtersBar);

    const statusBox = el('div'); panel.appendChild(statusBox);
    const gridBox = el('div', 'card-grid'); panel.appendChild(gridBox);
    const loadMoreRow = el('div'); panel.appendChild(loadMoreRow);
    root.appendChild(panel);

    function draw(){
      clear(gridBox); clear(loadMoreRow); clear(statusBox);
      if(exploreState.error){
        const box = el('div');
        showMsg(box, 'error', exploreState.error);
        statusBox.appendChild(box);
        const retryBtn = el('button', 'btn secondary', t('retry'));
        retryBtn.onclick = ()=>runExploreQuery({reset:true});
        statusBox.appendChild(retryBtn);
        return;
      }
      if(exploreState.loading && exploreState.rows.length === 0){
        showMsg(statusBox, 'info', t('explore.loading'));
        return;
      }
      if(!exploreState.loading && exploreState.rows.length === 0){
        showMsg(statusBox, 'info', t('explore.empty'));
        return;
      }
      exploreState.rows.forEach(card=>gridBox.appendChild(discoveryCardEl(card)));
      if(exploreState.nextCursor){
        const moreBtn = el('button', 'btn secondary load-more', exploreState.loading ? t('loading') : t('explore.loadMore'));
        moreBtn.disabled = exploreState.loading;
        moreBtn.onclick = ()=>runExploreQuery({reset:false});
        loadMoreRow.appendChild(moreBtn);
      }
    }
    exploreState.onDraw = draw;
    draw();
    // Re-run the query whenever the FILTER KEY (q/language/tag) differs
    // from the one last executed -- not just "has any query ever run" --
    // otherwise changing the search box/filters after the first load
    // would silently keep showing the previous, now-stale result set.
    const queryKey = JSON.stringify([exploreState.q, exploreState.language, exploreState.tag]);
    if(exploreState.lastQueryKey !== queryKey) runExploreQuery({reset:true});
  }

  async function runExploreQuery({reset}){
    if(reset){ exploreState.rows = []; exploreState.nextCursor = null; }
    exploreState.lastQueryKey = JSON.stringify([exploreState.q, exploreState.language, exploreState.tag]);
    exploreState.loading = true; exploreState.error = null;
    if(exploreState.onDraw) exploreState.onDraw();
    try{
      const {rows, nextCursor} = await listReleases({
        q: exploreState.q, language: exploreState.language, tag: exploreState.tag,
        cursor: reset ? null : exploreState.nextCursor
      });
      exploreState.rows = reset ? rows : exploreState.rows.concat(rows);
      exploreState.nextCursor = nextCursor;
    }catch(e){
      exploreState.error = errMsg(e.code) || e.message;
    }
    exploreState.loading = false;
    if(exploreState.onDraw) exploreState.onDraw();
  }

  function navigateExplore(patch){
    const next = {q: exploreState.q, lang: exploreState.language, tag: exploreState.tag};
    if('q' in patch) next.q = patch.q;
    if('language' in patch) next.lang = patch.language;
    if('tag' in patch) next.tag = patch.tag;
    navigateTo(next);
  }

  // ===================================================================
  // Release detail (spec § 14-27) -- fully public. Shows metadata, Mods
  // (never executed), compatibility, parent/children lineage, download,
  // Open in Runtime (handoff only, § 25), Remix (same handoff, § 27),
  // Copy Link.
  // ===================================================================
  function viewReleaseDetail(){
    const panel = el('div', 'panel');
    root.appendChild(panel);

    function draw(){
      clear(panel);
      if(releaseViewState.loading){
        showMsg(panel, 'info', t('release.loading'));
        return;
      }
      if(releaseViewState.error){
        showMsg(panel, 'error', releaseViewState.error);
        const retryBtn = el('button', 'btn secondary', t('retry'));
        retryBtn.onclick = ()=>loadReleaseView(releaseViewState.id);
        panel.appendChild(retryBtn);
        return;
      }
      const card = releaseViewState.card;
      if(!card) return;

      panel.appendChild(el('h2', null, card.title));
      const byLine = el('div', 'meta-line');
      if(card.author_display_name){
        byLine.textContent = t('release.byAuthor', {name: card.author_display_name}) + ' · ';
      }
      byLine.appendChild(document.createTextNode(t('release.publishedAt', {date: formatDate(card.published_at)})));
      panel.appendChild(byLine);

      if(card.creator_id){
        const authorLink = document.createElement('a');
        authorLink.href = '?profile=' + encodeURIComponent(card.creator_id);
        authorLink.className = 'plain-link';
        authorLink.textContent = card.author_display_name || t('profile.releasesTitle');
        authorLink.onclick = (ev)=>{ ev.preventDefault(); navigateTo({profile: card.creator_id}); };
        const authorRow = el('div', 'meta-line');
        authorRow.appendChild(authorLink);
        panel.appendChild(authorRow);
      }

      if(card.description) panel.appendChild(el('p', null, card.description));

      const compat = compatibilityOf(card);
      panel.appendChild(el('span', 'compat-badge ' + compat.cls, t('release.' + compat.label)));

      const provLine = el('div', 'meta-line');
      provLine.style.marginTop = '8px';
      if(card.parent_release_id){
        if(card.parent_title){
          const link = document.createElement('a');
          link.href = '?release=' + encodeURIComponent(card.parent_release_id);
          link.className = 'plain-link';
          link.textContent = t('release.remixOfTitle', {title: card.parent_title});
          link.onclick = (ev)=>{ ev.preventDefault(); navigateTo({release: card.parent_release_id}); };
          provLine.appendChild(link);
        } else {
          provLine.textContent = t('release.parentUnavailable');
        }
      } else {
        provLine.textContent = t('release.original');
      }
      if(card.generation > 0){
        const genNote = el('span', 'small'); genNote.textContent = '  (' + t('release.remix', {gen: card.generation}) + ')';
        provLine.appendChild(genNote);
      }
      panel.appendChild(provLine);

      if(Array.isArray(card.tags) && card.tags.length){
        const tagRow = el('div', 'tag-row'); tagRow.style.marginTop = '8px';
        card.tags.forEach(tag=>{
          const pill = el('span', 'tag-pill', tag);
          pill.onclick = ()=>navigateTo({tag});
          tagRow.appendChild(pill);
        });
        panel.appendChild(tagRow);
      }
      if(card.language){
        const langLine = el('div', 'meta-line'); langLine.style.marginTop = '6px';
        langLine.textContent = t('language') + ': ' + languageLabel(card.language);
        panel.appendChild(langLine);
      }
      if(card.release_note){
        const noteLine = el('div', 'meta-line'); noteLine.textContent = t('releaseNote') + ': ' + card.release_note;
        panel.appendChild(noteLine);
      }

      const actions = el('div', 'actions'); actions.style.marginTop = '14px';
      const dlBtn = el('button', 'btn secondary', t('release.downloadBtn'));
      dlBtn.onclick = ()=>{
        if(releaseViewState.snapshotText) downloadText(releaseFilename(card.title, card.id), releaseViewState.snapshotText);
      };
      actions.appendChild(dlBtn);

      const openBtn = el('button', 'btn', t('release.openInRuntimeBtn'));
      openBtn.onclick = ()=>openInRuntime(card.id);
      actions.appendChild(openBtn);

      const remixBtn = el('button', 'btn secondary', t('release.remixBtn'));
      remixBtn.onclick = ()=>openInRuntime(card.id);
      actions.appendChild(remixBtn);

      const copyBtn = el('button', 'btn secondary', t('release.copyLinkBtn'));
      copyBtn.onclick = async ()=>{
        const ok = await copyToClipboard(location.href);
        if(ok) toast(t('release.linkCopied'));
      };
      actions.appendChild(copyBtn);
      panel.appendChild(actions);

      const openHint = el('div', 'small'); openHint.style.marginTop = '6px';
      openHint.textContent = t('release.openInRuntimeHint');
      panel.appendChild(openHint);

      // Mods (never executed -- textContent only, read-only)
      const modsHeading = el('h2', null, t('release.modsTitle', {count: card.mod_count}));
      modsHeading.style.marginTop = '18px';
      panel.appendChild(modsHeading);
      const modsBox = el('div');
      panel.appendChild(modsBox);
      let snapshotMods = [];
      try{ snapshotMods = releaseViewState.snapshotText ? (JSON.parse(releaseViewState.snapshotText).mods || []) : []; }catch(e){ snapshotMods = []; }
      if(snapshotMods.length){
        renderModList(modsBox, snapshotMods);
      }

      // Technical details (collapsible)
      const details = document.createElement('details'); details.className = 'tech-details';
      const summary = document.createElement('summary'); summary.textContent = t('release.techDetails');
      details.appendChild(summary);
      const techList = el('div');
      [
        [t('release.runtimeVersion'), card.runtime_version],
        [t('release.apiVersion'), card.api_version],
        [t('release.vmpVersion'), card.vmp_version],
        [t('release.formatVersion'), card.community_release_format_version]
      ].forEach(([label, val])=>{
        if(val === null || val === undefined) return;
        techList.appendChild(el('div', 'meta-line', label + ': ' + val));
      });
      details.appendChild(techList);
      panel.appendChild(details);

      // Direct remixes
      const remixHeading = el('h2', null, t('release.remixesTitle') + (card.remix_count ? ' (' + card.remix_count + ')' : ''));
      remixHeading.style.marginTop = '18px';
      panel.appendChild(remixHeading);
      if(releaseViewState.children === null){
        appendMsg(panel, 'info', t('loading'));
      } else if(releaseViewState.children.length === 0){
        appendMsg(panel, 'info', t('release.remixesEmpty'));
      } else {
        const childGrid = el('div', 'card-grid');
        releaseViewState.children.forEach(c=>childGrid.appendChild(discoveryCardEl(c)));
        panel.appendChild(childGrid);
      }
    }
    releaseViewState.onDraw = draw;
    draw();
  }

  async function loadReleaseView(id){
    releaseViewState.loading = true; releaseViewState.error = null; releaseViewState.card = null; releaseViewState.children = null;
    if(releaseViewState.onDraw) releaseViewState.onDraw();
    try{
      const {card, snapshotText} = await getReleaseDetail(id);
      releaseViewState.card = card;
      releaseViewState.snapshotText = snapshotText;
      releaseViewState.loading = false;
      if(releaseViewState.onDraw) releaseViewState.onDraw();
      getChildren(id).then(children=>{
        releaseViewState.children = children;
        if(releaseViewState.onDraw) releaseViewState.onDraw();
      }).catch(()=>{ releaseViewState.children = []; if(releaseViewState.onDraw) releaseViewState.onDraw(); });
      if(currentTab === 'release') document.title = card.title + t('release.pageTitleSuffix');
    }catch(e){
      releaseViewState.loading = false;
      releaseViewState.error = errMsg(e.code) || e.message;
      if(releaseViewState.onDraw) releaseViewState.onDraw();
    }
  }

  function openInRuntime(releaseId){
    // Handoff (spec § 25/26): pass ONLY the remote Release id, never a
    // token. Opens in a new tab so this Portal's own session/tab state
    // is never touched by the Runtime.
    const base = COMMUNITY_BACKEND_CONFIG.runtimeBaseUrl;
    const sep = base.indexOf('?') === -1 ? '?' : '&';
    const win = window.open(base + sep + 'communityRelease=' + encodeURIComponent(releaseId), '_blank', 'noopener,noreferrer');
    if(win) win.opener = null;
  }

  // ===================================================================
  // Public profile (spec § 17-18/50-51/65/70)
  // ===================================================================
  function viewPublicProfile(){
    const panel = el('div', 'panel');
    root.appendChild(panel);

    function draw(){
      clear(panel);
      if(profileViewState.loading){
        showMsg(panel, 'info', t('profile.loading'));
        return;
      }
      if(profileViewState.error || !profileViewState.profile){
        showMsg(panel, 'error', profileViewState.error || t('profile.notFound'));
        return;
      }
      const profile = profileViewState.profile;
      const header = el('div', 'profile-header');
      header.appendChild(renderAvatar(profile.display_name, profile.avatar_url, true));
      const nameCol = el('div');
      nameCol.appendChild(el('h2', null, profile.display_name || '?'));
      if(profile.created_at){
        nameCol.appendChild(el('div', 'small', t('profile.joined', {date: formatDate(profile.created_at)})));
      }
      header.appendChild(nameCol);
      panel.appendChild(header);

      if(profile.bio) panel.appendChild(el('p', null, profile.bio));

      if(session && session.user && session.user.id === profile.user_id){
        const editBtn = el('button', 'btn secondary', t('profile.editBtn'));
        editBtn.onclick = ()=>goToTab('profile');
        panel.appendChild(editBtn);
      }

      const releasesHeading = el('h2', null, t('profile.releasesTitle'));
      releasesHeading.style.marginTop = '18px';
      panel.appendChild(releasesHeading);
      if(profileViewState.releases === null){
        appendMsg(panel, 'info', t('loading'));
      } else if(profileViewState.releases.length === 0){
        appendMsg(panel, 'info', t('profile.empty'));
      } else {
        const grid = el('div', 'card-grid');
        profileViewState.releases.forEach(c=>grid.appendChild(discoveryCardEl(c)));
        panel.appendChild(grid);
      }
    }
    profileViewState.onDraw = draw;
    draw();
  }

  async function loadProfileView(id){
    profileViewState.loading = true; profileViewState.error = null; profileViewState.profile = null; profileViewState.releases = null;
    if(profileViewState.onDraw) profileViewState.onDraw();
    try{
      const profile = await getPublicProfile(id);
      if(!profile){
        profileViewState.loading = false;
        profileViewState.error = t('profile.notFound');
        if(profileViewState.onDraw) profileViewState.onDraw();
        return;
      }
      profileViewState.profile = profile;
      profileViewState.loading = false;
      if(profileViewState.onDraw) profileViewState.onDraw();
      if(currentTab === 'profileView') document.title = (profile.display_name || '?') + t('profile.pageTitleSuffix');
      listProfileReleases(id).then(releases=>{
        profileViewState.releases = releases;
        if(profileViewState.onDraw) profileViewState.onDraw();
      }).catch(()=>{ profileViewState.releases = []; if(profileViewState.onDraw) profileViewState.onDraw(); });
    }catch(e){
      profileViewState.loading = false;
      profileViewState.error = errMsg(e.code) || e.message;
      if(profileViewState.onDraw) profileViewState.onDraw();
    }
  }

  function renderAll(){
    renderHeader();
    renderNav();
    clear(root);
    if(!COMMUNITY_BACKEND_CONFIG.enabled){
      const p = el('div', 'panel');
      showMsg(p, 'error', errMsg('COMMUNITY_NOT_CONFIGURED'));
      root.appendChild(p);
      return;
    }
    if(currentTab === 'auth') viewAuth();
    else if(currentTab === 'profile') viewProfile();
    else if(currentTab === 'publish') viewPublish();
    else if(currentTab === 'mine') viewMine();
    else if(currentTab === 'release') viewReleaseDetail();
    else if(currentTab === 'profileView') viewPublicProfile();
    else viewExplore();
  }

  document.getElementById('langSelect').addEventListener('change', (ev)=>{
    locale = ev.target.value;
    renderAll();
  });

  loadSession();
  document.getElementById('langSelect').value = locale;
  parseRoute();
  renderAll();

})();
</script>
